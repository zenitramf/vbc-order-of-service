<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  role="img"
  aria-label="VBC Portal — torch emblem on a circuit chip, derived from the VBC chip artwork"
>
  <defs>
    <linearGradient id="vbc-chip-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16283f" />
      <stop offset="0.55" stop-color="#0b1a2e" />
      <stop offset="1" stop-color="#081426" />
    </linearGradient>
    <linearGradient id="vbc-chip-flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e79a12" />
      <stop offset="1" stop-color="#ffc61a" />
    </linearGradient>
  </defs>

  <!-- Gold contact pins on all four sides of the chip package -->
  <g fill="#c9972f">
    <rect x="21.5" y="4" width="3" height="7" rx="0.8" />
    <rect x="27.5" y="4" width="3" height="7" rx="0.8" />
    <rect x="33.5" y="4" width="3" height="7" rx="0.8" />
    <rect x="39.5" y="4" width="3" height="7" rx="0.8" />
    <rect x="21.5" y="53" width="3" height="7" rx="0.8" />
    <rect x="27.5" y="53" width="3" height="7" rx="0.8" />
    <rect x="33.5" y="53" width="3" height="7" rx="0.8" />
    <rect x="39.5" y="53" width="3" height="7" rx="0.8" />
    <rect x="4" y="21.5" width="7" height="3" rx="0.8" />
    <rect x="4" y="27.5" width="7" height="3" rx="0.8" />
    <rect x="4" y="33.5" width="7" height="3" rx="0.8" />
    <rect x="4" y="39.5" width="7" height="3" rx="0.8" />
    <rect x="53" y="21.5" width="7" height="3" rx="0.8" />
    <rect x="53" y="27.5" width="7" height="3" rx="0.8" />
    <rect x="53" y="33.5" width="7" height="3" rx="0.8" />
    <rect x="53" y="39.5" width="7" height="3" rx="0.8" />
  </g>

  <!-- Chip package -->
  <rect
    x="10"
    y="10"
    width="44"
    height="44"
    rx="6"
    fill="url(#vbc-chip-body)"
    stroke="#5f7899"
    stroke-width="1.4"
  />
  <rect
    x="13.5"
    y="13.5"
    width="37"
    height="37"
    rx="4"
    fill="none"
    stroke="#22395a"
    stroke-width="1"
  />

  <!-- Corner screws -->
  <g fill="#0e2036" stroke="#c9972f" stroke-width="1.1">
    <circle cx="16.5" cy="16.5" r="2.1" />
    <circle cx="47.5" cy="16.5" r="2.1" />
    <circle cx="16.5" cy="47.5" r="2.1" />
    <circle cx="47.5" cy="47.5" r="2.1" />
  </g>

  <!-- Torch ring -->
  <circle cx="32" cy="32" r="13" fill="#0d2138" stroke="#3a5fa0" stroke-width="2.8" />

  <!-- Torch: gold flame -->
  <path
    d="M32 18.6c.7 1.9 1.9 3 2.9 4.3 1 1.3 1.7 2.5 1.7 3.9 0 2.5-2 4.1-4.6 4.1s-4.6-1.6-4.6-4.1c0-1.5.7-2.7 1.5-3.9.3 1 .8 1.8 1.5 2.3-.2-2.3.5-4.6 2.1-6.6Z"
    fill="url(#vbc-chip-flame)"
  />
  <!-- Torch: cup -->
  <path d="M25.8 31.4h12.4l-1.7 2.5h-9z" fill="#3a5fa0" />
  <path d="M27.2 34.9h9.6l-1.3 2.1h-7z" fill="#2e4e85" />
  <!-- Torch: stem forms the V -->
  <path
    d="M28.4 38.2 32 43.6l3.6-5.4"
    fill="none"
    stroke="#3a5fa0"
    stroke-width="2.3"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />
</svg>
