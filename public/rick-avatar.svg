      <stop offset="0" stop-color="#fde68a" />
      <stop offset="0.55" stop-color="#fbbf24" />
      <stop offset="1" stop-color="#fb923c" />
    </linearGradient>
    <linearGradient id="rick-shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4a63" />
      <stop offset="1" stop-color="#1f2a3d" />
